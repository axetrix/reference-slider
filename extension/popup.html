<html lang="en"><meta charset="utf-8"><title>Reference Slider</title>
<style>*{box-sizing:border-box}body{width:318px;margin:0;padding:24px;background:#181818;color:#fff;font:14px/1.5 system-ui;-webkit-font-smoothing:antialiased}h1{font-size:22px;margin:0 0 8px;letter-spacing:-.4px;text-wrap:balance}p{color:#bbb;text-wrap:pretty}button{width:100%;min-height:44px;padding:13px;border:0;border-radius:12px;background:#e60023;color:white;font:600 14px system-ui;cursor:pointer;transition:background-color .15s ease-out,scale .15s ease-out}button:hover{background:#c90020}button:active{scale:.96}#library{margin-top:10px;background:#333}#library:hover{background:#444}button:focus-visible{outline:2px solid white;outline-offset:3px}#status{font-size:12px;margin-bottom:0}@media(prefers-reduced-motion:reduce){button{transition:none}}</style>
